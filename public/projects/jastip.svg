  <circle cx="475" cy="557" r="10" fill="#475569"/>
  <text x="475" y="561" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="900" text-anchor="middle">O</text>
  <text x="500" y="555" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Onitsuka Tiger Mexico 66 SD (Size 42)</text>
  <text x="500" y="570" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="500">Pemesan: @kevin.andhika | 1 Pasang | 17,600 JPY &#8594; Rp 2.250.000</text>
  <rect x="980" y="544" width="95" height="26" rx="6" fill="#475569" fill-opacity="0.3" stroke="#64748b" stroke-width="1"/>
  <text x="1027" y="561" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">WISHLIST</text>

