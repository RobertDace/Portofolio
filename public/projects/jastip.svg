  <circle cx="106" cy="67" r="5" fill="#38bdf8"/>
  <circle cx="122" cy="67" r="5" fill="#34d399"/>
  <text x="145" y="72" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">JASTIPPRO // OVERSEAS SHOPPING &amp; LOGISTICS SUITE</text>
  
